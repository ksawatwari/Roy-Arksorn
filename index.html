<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RoyAksorn | รอยอักษร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@200;300;400;600&family=Pattaya&family=Pridi:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --zen-red: #A31D1D; --zen-white: #FFFFFF; }
        body { font-family: 'Anuphan', sans-serif; background-color: var(--zen-white); color: #1a1a1a; margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .font-pattaya { font-family: 'Pattaya', sans-serif; }
        .font-header { font-family: 'Pridi', serif; }

        /* Navbar UI */
        .btn-join { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 2px solid #A31D1D; }
        .btn-join:hover { background-color: var(--zen-red); color: white !important; }

        /* Mobile Panel */
        #mobile-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .submenu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #fcfcfc; }
        .submenu.active { max-height: 500px; }

        /* Profile Logic UI */
        .profile-img-nav {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid var(--zen-red);
            object-fit: cover;
            cursor: pointer;
        }

        .reveal { opacity: 0; transform: translateY(30px); transition: 1s all ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>

<body>

    <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-[1001] opacity-0 pointer-events-none transition-opacity duration-300" onclick="toggleMobileMenu()"></div>
    
    <div id="mobile-panel" class="fixed top-0 right-0 h-full w-[80%] max-w-[350px] bg-white z-[1002] translate-x-full shadow-2xl p-8 font-header overflow-y-auto">
        <div class="flex justify-between items-center mb-10">
            <span class="text-[#A31D1D] font-bold text-xl uppercase tracking-widest">Roy Aksorn</span>
            <button onclick="toggleMobileMenu()" class="text-stone-400">✕ ปิด</button>
        </div>
        
        <div id="mobile-user-info" class="mb-8">
            <div class="flex flex-col gap-6">
                <button onclick="loginWithGoogle()" class="text-2xl text-stone-800 text-left font-light">ล็อกอิน</button>
                <button onclick="loginWithGoogle()" class="text-2xl text-[#A31D1D] font-bold text-left underline underline-offset-8">ฝากตัว</button>
            </div>
        </div>

        <div class="flex flex-col gap-6">
            <hr class="border-stone-100">
            <div>
                <button onclick="toggleSubmenu()" class="text-2xl text-stone-800 flex justify-between items-center w-full">
                    หมวดหมู่ <span id="arrow">↓</span>
                </button>
                <div id="mobile-submenu" class="submenu flex flex-col pl-4 mt-4 gap-4 border-l-2 border-stone-100">
                    <a href="#" class="text-stone-500">Originals / ออริจินัล</a>
                    <a href="article.html" class="text-stone-500">Books Review / แว่วอักษร</a>
                </div>
            </div>
            <a href="library.html" class="text-2xl text-stone-800">งานเขียนของข้าพเจ้า</a>
            <div id="mobile-logout-area"></div>
        </div>
    </div>

    <nav class="flex justify-between items-center px-6 md:px-10 py-5 border-b border-stone-100 sticky top-0 bg-white/95 backdrop-blur-md z-[999]">
        <div class="font-header font-bold text-2xl md:text-3xl tracking-tighter text-[#A31D1D]">
            <a href="index.html">ROY AKSORN</a>
        </div>

        <div class="flex items-center gap-3">
            <div class="hidden lg:flex items-center gap-8 mr-6">
                <a href="library.html" class="font-header text-sm font-semibold text-[#A31D1D] border-b-2 border-[#A31D1D]">งานเขียนของข้าพเจ้า</a>
                <a href="#" class="font-header text-sm text-stone-500 hover:text-[#A31D1D]">หมวดหมู่</a>
            </div>

            <div id="nav-auth-group" class="hidden lg:flex items-center gap-4 font-header">
                <button onclick="loginWithGoogle()" class="text-stone-500 text-sm font-bold uppercase">Login</button>
                <button onclick="loginWithGoogle()" class="btn-join px-6 py-1.5 text-[#A31D1D] text-sm font-bold rounded-full">ฝากตัว</button>
            </div>

            <div id="dynamic-nav-container" class="flex items-center gap-3">
                <button id="hamburger-btn" class="p-1 text-[#A31D1D]" onclick="toggleMobileMenu()">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
                
                <div id="profile-img-holder"></div>
            </div>
        </div>
    </nav>

    <header class="bg-[#A31D1D] text-white py-32 text-center border-b-[12px] border-stone-900">
        <h2 class="font-pattaya text-[6rem] md:text-[10rem] mb-2 leading-none"><span class="opacity-40">รอย</span>อักษร</h2>
        <p class="font-header text-white/70 tracking-[0.2em]">เมื่อตัวอักษร... เริ่มเล่าเรื่อง</p>
    </header>

    <main class="max-w-7xl mx-auto py-20 px-6">
        <div class="reveal bg-stone-50 p-12 rounded-3xl text-center border border-stone-100">
            <h3 class="font-header text-3xl mb-4 text-stone-800">ยินดีต้อนรับสู่พื้นที่แห่งการจารึก</h3>
            <p class="text-stone-500 italic font-light">"ทุกรอยอักษร คือการบันทึกจิตวิญญาณ"</p>
        </div>
    </main>

    <footer class="bg-stone-950 text-stone-600 py-10 text-center text-[10px] tracking-[0.8em] font-bold">
        ROY AKSORN / 2026
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGOEKhvyPZKID9AD0Y1npAry2QmiE4ieU",
            authDomain: "royarksorn.firebaseapp.com",
            projectId: "royarksorn",
            storageBucket: "royarksorn.firebasestorage.app",
            messagingSenderId: "6587270930",
            appId: "1:6587270930:web:cef1d91e936b09478815cb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const userDoc = await getDoc(doc(db, "users", result.user.uid));
                if (!userDoc.exists()) window.location.href = "setup-profile.html";
            } catch (error) { console.error(error); }
        };

        window.logout = () => signOut(auth).then(() => window.location.reload());

        // --- AUTH & AVATAR UPGRADE LOGIC ---
        onAuthStateChanged(auth, async (user) => {
            const authGroup = document.getElementById('nav-auth-group');
            const profileImgHolder = document.getElementById('profile-img-holder');
            const mobileUserInfo = document.getElementById('mobile-user-info');
            const mobileLogoutArea = document.getElementById('mobile-logout-area');

            if (user) {
                // ดึงข้อมูลจาก Firestore ก่อนเพื่อนเลย
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                // เช็คว่ามี avatarUrl ใน DB ไหม ถ้าไม่มีค่อยใช้ photoURL ของ Google
                let finalAvatar = user.photoURL; 
                let finalName = user.displayName;

                if (userDoc.exists()) {
                    const data = userDoc.data();
                    finalAvatar = data.avatarUrl || user.photoURL; // ดึงอวาตาร์ที่เซ็ตไว้มาใช้
                    finalName = data.username || user.displayName;
                }

                // 1. Desktop Login Buttons -> ซ่อน
                authGroup.classList.add('hidden');

                // 2. ฉีดรูปโปรไฟล์ "ต่อท้าย" Hamburger (ทำให้มันอยู่ขวาสุด)
                profileImgHolder.innerHTML = `
                    <img src="${finalAvatar}" 
                         class="profile-img-nav hover:scale-110 transition-transform" 
                         onclick="toggleMobileMenu()"
                         onerror="this.src='https://ui-avatars.com/api/?name=${finalName}&background=A31D1D&color=fff'">
                `;

                // 3. ปรับ Mobile Menu ข้างใน
                mobileUserInfo.innerHTML = `
                    <div class="flex items-center gap-4 p-5 bg-stone-50 rounded-2xl border border-stone-100 shadow-sm">
                        <img src="${finalAvatar}" class="w-16 h-16 rounded-full border-2 border-[#A31D1D] object-cover" onerror="this.src='https://ui-avatars.com/api/?name=${finalName}'">
                        <div class="flex flex-col">
                            <span class="text-[#A31D1D] text-[10px] font-bold tracking-widest uppercase">ผู้จารึก</span>
                            <span class="text-stone-800 font-bold text-xl">${finalName}</span>
                        </div>
                    </div>
                `;
                mobileLogoutArea.innerHTML = `<button onclick="logout()" class="w-full mt-10 py-4 border-t text-left text-stone-400 font-header text-xl hover:text-[#A31D1D]">ออกจากระบบ</button>`;

            } else {
                authGroup.classList.remove('hidden');
                profileImgHolder.innerHTML = '';
            }
        });
    </script>

    <script>
        function toggleMobileMenu() {
            const overlay = document.getElementById('mobile-overlay');
            const panel = document.getElementById('mobile-panel');
            const isOpen = panel.classList.contains('translate-x-0');
            panel.classList.toggle('translate-x-0', !isOpen);
            panel.classList.toggle('translate-x-full', isOpen);
            overlay.style.opacity = isOpen ? "0" : "1";
            overlay.style.pointerEvents = isOpen ? "none" : "auto";
        }

        function toggleSubmenu() {
            const submenu = document.getElementById('mobile-submenu');
            const arrow = document.getElementById('arrow');
            submenu.classList.toggle('active');
            arrow.innerHTML = submenu.classList.contains('active') ? '↑' : '↓';
        }

        window.addEventListener("scroll", () => {
            document.querySelectorAll(".reveal").forEach(el => {
                if(el.getBoundingClientRect().top < window.innerHeight - 100) el.classList.add("active");
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รอยอักษร | จารึกเรื่องราว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;600&family=Sarabun:wght@400;500&family=Pridi:wght@400;600&family=Mitr:wght@300;400&family=Kanit:wght@300;400&family=Chakra+Petch:wght@300;400&family=Bai+Jamjuree:wght@300;400&family=Charm:wght@400;700&family=Itim&family=Mali&family=Srisakdi&family=Taviraj&family=Trirong&family=Athiti&family=Krub&family=KoHo&family=Kodchasan&family=Fahkwang&family=Sriracha&family=Prompt:wght@300;400&family=Niramit&family=K2D&family=Jura&family=Sarala&family=Suton&family=Pattaya&family=IBM+Plex+Sans+Thai:wght@300;400&family=Noto+Sans+Thai:wght@300;400&family=Thasadith&family=Chonburi&family=Laila&family=Maitree&family=Siamreap&family=Battambang&family=Krutidev+010&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --zen-red: #A31D1D;
            --zen-stone: #f4f4f2;
            --toolbar-white: rgba(255, 255, 255, 0.95);
        }

        body {
            background-color: var(--zen-stone);
            font-family: 'Anuphan', sans-serif;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            scroll-behavior: smooth;
        }

        /* --- Super-Floating Toolbar --- */
        #toolbar {
            position: fixed;
            z-index: 9999;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toolbar-white);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 1);
            backdrop-filter: blur(12px);
            touch-action: none;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            user-select: none;
            border: 1px solid #e2e2e2;
        }

        .toolbar-handle {
            cursor: grab;
            padding: 8px;
            color: #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #f0f0f0;
            margin-right: 4px;
        }

        .toolbar-handle:hover {
            color: var(--zen-red);
        }

        #toolbar.folded {
            width: 52px !important;
            height: 52px !important;
            border-radius: 15px;
            padding: 0;
            background: var(--zen-red);
            justify-content: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(163, 29, 29, 0.4);
        }

        #toolbar.folded .toolbar-content,
        #toolbar.folded .toolbar-handle,
        #toolbar.folded .fold-btn-ui {
            display: none !important;
        }

        #toolbar.folded .a-icon {
            display: flex !important;
            color: white;
            font-family: 'Pridi';
            font-weight: 700;
            font-size: 24px;
        }

        #toolbar.vertical {
            flex-direction: column;
            width: 68px;
            height: auto;
            padding: 24px 10px;
        }

        #toolbar.vertical .toolbar-content {
            flex-direction: column;
            width: 100%;
            gap: 10px;
        }

        #toolbar.vertical .group-divider {
            width: 40px;
            height: 1px;
            margin: 12px 0;
        }

        #toolbar.vertical select {
            width: 50px;
            font-size: 10px;
        }

        .toolbar-content {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Icon Buttons */
        .btn-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #444;
            transition: all 0.25s ease;
            position: relative;
        }

        .btn-icon:hover {
            background: #f1f1f1;
            color: var(--zen-red);
            transform: scale(1.05);
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
        }

        .group-divider {
            width: 1px;
            height: 28px;
            background: #ececec;
            margin: 0 6px;
        }

        .color-wrapper {
            position: relative;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #ddd;
        }

        #colorInput {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 55px;
            height: 55px;
            cursor: pointer;
        }

        /* --- Content Layout --- */
        .writer-container {
            max-width: 880px;
            margin: 140px auto 100px;
            position: relative;
        }

        .setup-section {
            background: white;
            border-radius: 28px;
            padding: 35px;
            margin-bottom: 30px;
            border: 1px solid #efefef;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.02);
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .cover-wrapper {
            position: relative;
            width: 120px;
            height: 160px;
            flex-shrink: 0;
            background: #fafafa;
            border-radius: 18px;
        }

        .remove-cover-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            background: var(--zen-red);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 5px 15px rgba(163, 29, 29, 0.4);
            border: 3px solid white;
        }

        .paper {
            background: white;
            min-height: 1100px;
            padding: 90px 110px;
            box-shadow: 0 15px 60px rgba(0, 0, 0, 0.05);
            border-radius: 5px;
        }

        #editor-content {
            outline: none;
            font-family: 'Sarabun';
            font-size: 20px;
            line-height: 2.4;
            color: #2c2c2c;
            text-align: justify;
        }

        #editor-content:empty:before {
            content: "จารึกถ้อยคำของคุณลงที่นี่...";
            color: #d1d1d1;
        }

        .save-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(163, 29, 29, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(163, 29, 29, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(163, 29, 29, 0);
            }
        }
    </style>
</head>

<body>

    <div id="toolbar" onclick="checkIfFoldedClick(event)">
        <div class="toolbar-handle">
            <svg viewBox="0 0 16 16" fill="currentColor">
                <path
                    d="M7 2a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 5a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z" />
            </svg>
        </div>

        <div class="a-icon hidden">A</div>

        <div class="toolbar-content">
            <button onclick="execCmd('bold')" class="btn-icon"><b>B</b></button>
            <button onclick="execCmd('italic')" class="btn-icon"><i>I</i></button>
            <button onclick="execCmd('underline')" class="btn-icon"><u>U</u></button>

            <div class="color-wrapper mx-1">
                <input type="color" id="colorInput" oninput="execCmd('foreColor', this.value)">
            </div>

            <div class="group-divider"></div>

            <button onclick="execCmd('justifyLeft')" class="btn-icon" title="ชิดซ้าย">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 10H3M21 6H3M21 14H3M17 18H3" />
                </svg>
            </button>
            <button onclick="execCmd('justifyCenter')" class="btn-icon" title="กึ่งกลาง">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 10H6M21 6H3M21 14H3M18 18H6" />
                </svg>
            </button>
            <button onclick="execCmd('justifyFull')" class="btn-icon" title="กระจายตัว">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10H3M21 6H3M21 14H3M21 18H3" />
                </svg>
            </button>

            <div class="group-divider"></div>

            <select id="fontSelector" onchange="execCmd('fontName', this.value)"
                class="text-[12px] font-semibold outline-none bg-transparent max-w-[120px] cursor-pointer">
                <optgroup label="ยอดนิยม">
                    <option value="Sarabun">Sarabun</option>
                    <option value="Anuphan">Anuphan</option>
                    <option value="Prompt">Prompt</option>
                    <option value="Kanit">Kanit</option>
                </optgroup>
                <optgroup label="ทางการ / เรียบหรู">
                    <option value="Pridi">Pridi</option>
                    <option value="Taviraj">Taviraj</option>
                    <option value="Trirong">Trirong</option>
                    <option value="Thasadith">Thasadith</option>
                    <option value="Niramit">Niramit</option>
                    <option value="Mitr">Mitr</option>
                </optgroup>
                <optgroup label="นิยาย / ลายมือ">
                    <option value="Charm">Charm</option>
                    <option value="Itim">Itim</option>
                    <option value="Mali">Mali</option>
                    <option value="Sriracha">Sriracha</option>
                    <option value="Pattaya">Pattaya</option>
                </optgroup>
            </select>

            <button onclick="saveStory()"
                class="ml-4 bg-[#A31D1D] text-white px-5 py-2.5 rounded-2xl text-[11px] font-bold hover:bg-black transition-all shadow-lg active:scale-95">SAVE</button>
        </div>

        <button onclick="toggleFold(event)" class="fold-btn-ui ml-2 text-stone-300 hover:text-red-500">
            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-width="3" stroke-linecap="round" d="M18 12H6" />
            </svg>
        </button>
    </div>

    <div class="writer-container">
        <div class="setup-section">
            <div class="cover-wrapper">
                <div id="removeBtn" class="remove-cover-btn" onclick="removeCover()">✕</div>
                <div class="w-full h-full border-2 border-dashed border-stone-200 rounded-2xl flex items-center justify-center cursor-pointer overflow-hidden hover:border-red-300 transition-all bg-white"
                    onclick="document.getElementById('fileInput').click()">
                    <img id="p-cover" class="w-full h-full object-cover hidden">
                    <div id="p-label" class="text-center">
                        <span class="block text-[24px] text-stone-300">+</span>
                        <span class="text-[9px] text-stone-400 font-bold uppercase tracking-widest">เพิ่มรูปปก</span>
                    </div>
                    <input type="file" id="fileInput" hidden onchange="previewImg(this)">
                </div>
            </div>

            <div class="flex-1">
                <input type="text" id="p-title" placeholder="ตั้งชื่อรอยอักษรของคุณ..."
                    class="w-full text-4xl font-bold outline-none mb-3 text-stone-800 placeholder-stone-200">
                <textarea id="p-excerpt" placeholder="เขียนคำโปรยสั้นๆ เพื่อดึงดูดผู้อ่าน..."
                    class="w-full text-lg text-stone-400 outline-none h-20 resize-none leading-relaxed"></textarea>
            </div>
        </div>

        <div class="paper">
            <div id="editor-content" contenteditable="true" spellcheck="false"></div>
        </div>
    </div>

    <script>
        const toolbar = document.getElementById('toolbar');
        let isDragging = false;
        let startX, startY;

        // --- Dragging Logic (Longer & Detailed) ---
        toolbar.onmousedown = function (e) {
            if (e.target.closest('.toolbar-handle')) {
                isDragging = true;
                toolbar.style.transition = 'none';
                const rect = toolbar.getBoundingClientRect();
                startX = e.clientX - rect.left;
                startY = e.clientY - rect.top;
                document.onmousemove = moveAt;
                document.onmouseup = stopDrag;
            }
        };

        function moveAt(e) {
            if (!isDragging) return;
            let targetX = e.clientX - startX;
            let targetY = e.clientY - startY;

            // Side detection for vertical transformation
            if (targetX < 120 || targetX > window.innerWidth - 180) {
                toolbar.classList.add('vertical');
            } else {
                toolbar.classList.remove('vertical');
            }

            // Boundary constraints
            targetX = Math.max(0, Math.min(targetX, window.innerWidth - toolbar.offsetWidth));
            targetY = Math.max(0, Math.min(targetY, window.innerHeight - toolbar.offsetHeight));

            toolbar.style.left = (targetX + (toolbar.offsetWidth / 2)) + 'px';
            toolbar.style.top = targetY + 'px';
            toolbar.style.transform = 'translateX(-50%)';
        }

        function stopDrag() {
            isDragging = false;
            toolbar.style.transition = 'all 0.5s cubic-bezier(0.19, 1, 0.22, 1)';
            document.onmousemove = null;
        }

        // --- UI Interactions ---
        function toggleFold(e) {
            if (e) e.stopPropagation();
            toolbar.classList.toggle('folded');
        }

        function checkIfFoldedClick(e) {
            if (toolbar.classList.contains('folded')) toggleFold();
        }

        function execCmd(cmd, val = null) {
            document.execCommand(cmd, false, val);
            // เพิ่มการ focus กลับมาที่ editor
            document.getElementById('editor-content').focus();
        }

        // --- Cover Management ---
        function previewImg(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById('p-cover');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('p-label').classList.add('hidden');
                    document.getElementById('removeBtn').style.display = 'flex';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeCover() {
            const img = document.getElementById('p-cover');
            img.src = "";
            img.classList.add('hidden');
            document.getElementById('p-label').classList.remove('hidden');
            document.getElementById('removeBtn').style.display = 'none';
            document.getElementById('fileInput').value = "";
        }

        // --- Enhanced Data Management & Font Loading ---
        let currentId = new URLSearchParams(window.location.search).get('id') || Date.now();

        window.onload = function () {
            // Load content from localStorage
            const savedData = JSON.parse(localStorage.getItem('archivist_docs') || '[]');
            const activeDoc = savedData.find(d => d.id == currentId);

            if (activeDoc) {
                document.getElementById('p-title').value = activeDoc.title || "";
                document.getElementById('p-excerpt').value = activeDoc.excerpt || "";
                document.getElementById('editor-content').innerHTML = activeDoc.content || "";
                if (activeDoc.cover) {
                    const img = document.getElementById('p-cover');
                    img.src = activeDoc.cover;
                    img.classList.remove('hidden');
                    document.getElementById('p-label').classList.add('hidden');
                    document.getElementById('removeBtn').style.display = 'flex';
                }
            }

            // Load all fonts (Extended list)
            const masterFonts = [
                "Krub", "Sarala", "Suton", "Jura", "K2D", "Laila", "Maitree",
                "Siamreap", "Battambang", "Fahkwang", "KoHo", "Kodchasan",
                "Athiti", "Bai Jamjuree", "Chakra Petch", "Srisakdi", "Taviraj",
                "Trirong", "Niramit", "IBM Plex Sans Thai", "Noto Sans Thai", "Thasadith",
                "Mali", "Sriracha", "Itim", "Charm", "Pattaya"
            ];

            const fontDropdown = document.getElementById('fontSelector');
            masterFonts.sort().forEach(fontName => {
                const optionExists = Array.from(fontDropdown.options).some(opt => opt.value === fontName);
                if (!optionExists) {
                    const opt = document.createElement('option');
                    opt.value = fontName;
                    opt.innerText = fontName;
                    fontDropdown.appendChild(opt);
                }
            });
        };

        function saveStory() {
            const titleInput = document.getElementById('p-title').value || "Untitled Story";
            const excerptInput = document.getElementById('p-excerpt').value || "";
            const contentBody = document.getElementById('editor-content').innerHTML;
            const coverImage = document.getElementById('p-cover');
            const coverSrc = coverImage.classList.contains('hidden') ? "" : coverImage.src;

            let allDocs = JSON.parse(localStorage.getItem('archivist_docs') || '[]');
            const targetIndex = allDocs.findIndex(d => d.id == currentId);

            const storyObject = {
                id: parseInt(currentId),
                title: titleInput,
                excerpt: excerptInput,
                content: contentBody,
                cover: coverSrc,
                updated: Date.now()
            };

            if (targetIndex > -1) {
                allDocs[targetIndex] = storyObject;
            } else {
                allDocs.push(storyObject);
            }

            try {
                localStorage.setItem('archivist_docs', JSON.stringify(allDocs));
                alert('จารึกรอยอักษรสำเร็จแล้ว!');
                window.location.href = 'library.html';
            } catch (e) {
                alert('หน่วยความจำเต็ม! ไม่สามารถเซฟรูปขนาดใหญ่เกินไปได้');
            }
        }
    </script>
</body>

</html>

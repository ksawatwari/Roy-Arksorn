<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterpiece Eternal | หอจดหมายเหตุรอยอักษร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Charm:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --zen-red: #A31D1D;
            --zen-ink: #1c1917;
            --zen-cream: #fdfcf8;
            --zen-gray: #78716c;
            --zen-gold: #D4AF37;
        }

        * {
            box-sizing: border-box;
            font-family: 'Anuphan', sans-serif !important;
            letter-spacing: -0.015em !important;
            margin: 0;
            padding: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-y: auto;
        }

        body::-webkit-scrollbar {
            width: 8px;
        }

        body::-webkit-scrollbar-thumb {
            background: var(--zen-gray);
            border-radius: 10px;
        }

        .main-card {
            display: flex;
            width: 1180px;
            min-height: 700px;
            height: auto;
            background: white;
            border-radius: 4px;
            box-shadow: 0 60px 120px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: visible;
        }

        /* Sidebar Preview (Sticky) */
        .sidebar-preview {
            width: 420px;
            background: var(--zen-ink);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
            text-align: center;
            position: sticky;
            top: 40px;
            align-self: flex-start;
            min-height: 700px;
        }

        /* Avatar Container with Pencil Button */
        .avatar-container {
            position: relative;
            margin-bottom: 35px;
        }

        .avatar-main {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: white;
            border: 6px solid rgba(255, 255, 255, 0.08);
            object-fit: cover;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            filter: grayscale(100%);
        }

        .pencil-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--zen-red);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid var(--zen-ink);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .pencil-btn:hover {
            transform: scale(1.1) rotate(15deg);
            background: #cc2626;
        }

        .label-sm {
            font-size: 10px;
            color: var(--zen-gray);
            letter-spacing: 3.5px !important;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .name-display {
            font-size: 38px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.1;
            color: #fff;
        }

        .signature-font {
            font-family: 'Charm', cursive !important;
            font-size: 24px;
            color: var(--zen-red);
            margin-bottom: 30px;
            opacity: 0.85;
        }

        .badge-title {
            font-size: 13px;
            color: #d6d3d1;
            padding: 9px 32px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            display: inline-block;
            font-weight: 300;
        }

        /* Form Content Area */
        .form-area {
            flex-grow: 1;
            background: var(--zen-cream);
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--zen-ink);
            margin-bottom: 4px;
            letter-spacing: -2px !important;
        }

        .divider-red {
            width: 55px;
            height: 6px;
            background: var(--zen-red);
            margin-bottom: 40px;
        }

        .field-group {
            margin-bottom: 30px;
            position: relative;
        }

        .field-label {
            font-size: 11px;
            color: #a8a29e;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px !important;
            margin-bottom: 8px;
            display: block;
        }

        .char-counter {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 10px;
            color: var(--zen-gray);
            font-weight: 700;
        }

        .field-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2.5px solid #e7e5e4;
            padding: 10px 0;
            font-size: 19px;
            outline: none;
            color: var(--zen-ink);
        }

        .field-input:focus {
            border-bottom-color: var(--zen-red);
        }

        /* Choice Buttons */
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .choice-btn {
            background: white;
            border: 1.5px solid #e7e5e4;
            padding: 16px 8px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            color: #57534e;
            text-align: center;
        }

        .choice-btn:hover {
            border-color: var(--zen-red);
            color: var(--zen-red);
            transform: translateY(-3px);
        }

        .choice-btn.active {
            background: var(--zen-red);
            color: white !important;
            border-color: var(--zen-red);
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(163, 29, 29, 0.3);
        }

        /* Action Button */
        .btn-finalize {
            margin-top: 50px;
            background: var(--zen-red);
            color: white;
            padding: 22px;
            font-weight: 700;
            font-size: 22px;
            border: none;
            cursor: pointer;
            border-radius: 2px;
            letter-spacing: 3px !important;
            text-transform: uppercase;
        }

        .btn-finalize:hover:not(:disabled) {
            background: var(--zen-ink);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Cinematic Overlay */
        #sacred-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(28, 25, 23, 0.97);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            z-index: 5000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .sacred-circle {
            width: 300px;
            height: 300px;
            border: 2px solid var(--zen-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: sacred-pulse 4s infinite ease-in-out;
        }

        .sacred-text {
            font-family: 'Charm', cursive !important;
            color: var(--zen-gold);
            font-size: 32px;
            text-align: center;
            margin-top: 40px;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes sacred-pulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 100px rgba(212, 175, 55, 0.4);
            }
        }

        @keyframes fade-up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .particle {
            position: absolute;
            background: var(--zen-gold);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            padding: 50px;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--zen-cream);
            width: 900px;
            height: 80vh;
            padding: 40px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }

        .avatar-scroll {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            overflow-y: auto;
            padding: 10px;
            flex-grow: 1;
        }

        .avatar-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .avatar-scroll::-webkit-scrollbar-thumb {
            background: var(--zen-red);
        }

        .avatar-card {
            aspect-ratio: 1;
            border: 2px solid #e7e5e4;
            border-radius: 12px;
            cursor: pointer;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: grayscale(100%);
        }

        .avatar-card:hover {
            border-color: var(--zen-red);
            transform: translateY(-4px);
            filter: grayscale(0%);
        }
    </style>
</head>

<body>

    <div id="sacred-overlay">
        <div class="sacred-circle">
            <div id="sacred-avatar-target"></div>
        </div>
        <h2 id="blessing-text" class="sacred-text">นามของท่านถูกจารึกไว้ชั่วนิรันดร์</h2>
    </div>

    <div class="main-card">
        <div class="sidebar-preview">
            <div class="avatar-container">
                <img id="p-avatar" src="https://api.dicebear.com/7.x/lorelei/svg?seed=RoyAksorn&backgroundColor=ffffff"
                    class="avatar-main">
                <label for="up-file" class="pencil-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                    </svg>
                </label>
                <input type="file" id="up-file" class="hidden" accept="image/*" onchange="handleFile(event)">
            </div>
            <div class="w-full px-4">
                <p class="label-sm">นามจารึก</p>
                <h2 id="p-name" class="name-display">---</h2>
                <p id="p-sig" class="signature-font">Signature</p>
                <p class="label-sm">ฉายา</p>
                <div id="p-title" class="badge-title">หนอนหนังสือผู้หิวโหย</div>
            </div>
        </div>

        <div class="form-area">
            <div id="avatar-modal" class="modal-overlay">
                <div class="modal-content">
                    <div class="flex justify-between items-center mb-6">
                        <h3 style="font-size: 28px; font-weight: 700; color: var(--zen-ink);">คลังอวาตาร์รอยอักษร (96
                            แบบ)</h3>
                        <button onclick="openModal(false)" class="text-red-700 font-bold hover:underline">✕ ปิด</button>
                    </div>
                    <div class="avatar-scroll" id="grid-container"></div>
                </div>
            </div>

            <h1 class="main-title">จารึกรายละเอียดตัวตน</h1>
            <div class="divider-red"></div>

            <div class="field-group">
                <label class="field-label">นามจารึกสำหรับแสดงผล</label>
                <span class="char-counter"><span id="count-num">0</span>/20</span>
                <input type="text" id="name-field" class="field-input" placeholder="ระบุชื่อ..." maxlength="20"
                    oninput="masterSync(this.value)">
                <p id="error-hint" class="text-[11px] text-red-600 mt-1 hidden font-semibold">ขออภัย
                    นามจารึกนี้มีคำไม่เหมาะสม</p>
            </div>

            <div class="field-group">
                <label class="field-label">คำแนะนำตัว (Bio)</label>
                <input type="text" id="bio-field" class="field-input" placeholder="บอกเล่าเรื่องราวของท่านสั้นๆ...">
            </div>

            <div class="field-group">
                <label class="field-label">ตัวเลือกอวาตาร์</label>
                <button onclick="openModal(true)"
                    class="bg-white border border-stone-300 px-6 py-3 rounded-sm text-xs font-bold uppercase tracking-widest hover:border-red-700 hover:text-red-700 flex items-center gap-2">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    เปิดคลังภาพ (96 แบบ)
                </button>
            </div>

            <div class="field-group">
                <label class="field-label">เลือกฉายาประจำตัว</label>
                <div class="choice-grid">
                    <div class="choice-btn active" onclick="setAlias(this, 'หนอนหนังสือผู้หิวโหย')">หนอนหนังสือผู้หิวโหย
                    </div>
                    <div class="choice-btn" onclick="setAlias(this, 'ดองจนเค็ม')">ดองจนเค็ม</div>
                    <div class="choice-btn" onclick="setAlias(this, 'จอมยุทธ์หน้ากระดาษ')">จอมยุทธ์หน้ากระดาษ</div>
                    <div class="choice-btn" onclick="setAlias(this, 'ยอดนักอ่านขอบเตียง')">ยอดนักอ่านขอบเตียง</div>
                    <div class="choice-btn" onclick="setAlias(this, 'ผู้เฝ้ากระดาษ')">ผู้เฝ้ากระดาษ</div>
                    <div class="choice-btn" onclick="setAlias(this, 'นิทราข้ามบท')">นิทราข้ามบท</div>
                </div>
            </div>

            <button id="final-btn" class="btn-finalize" onclick="executeSacredAwakening()">สร้าง</button>
        </div>
    </div>

    <script>
        const badWords = ['ควย', 'เหี้ย', 'เย็ด', 'มึง', 'กู', 'สัด', 'ระยำ', 'fuck', 'shit'];

        function masterSync(val) {
            const input = document.getElementById('name-field');
            const hint = document.getElementById('error-hint');
            const btn = document.getElementById('final-btn');
            const counter = document.getElementById('count-num');
            const pName = document.getElementById('p-name');
            const pSig = document.getElementById('p-sig');
            counter.innerText = val.length;
            const isBad = badWords.some(w => val.includes(w));
            if (isBad) {
                input.classList.add('error'); hint.classList.remove('hidden'); btn.disabled = true;
                pName.innerText = "---"; pSig.innerText = "Signature";
            } else {
                input.classList.remove('error'); hint.classList.add('hidden'); btn.disabled = val.length === 0;
                if (val.length > 15) pName.style.fontSize = '26px';
                else if (val.length > 10) pName.style.fontSize = '32px';
                else pName.style.fontSize = '38px';
                pName.innerText = val || "---"; pSig.innerText = val || "Signature";
            }
        }

        const grid = document.getElementById('grid-container');
        for (let i = 1; i <= 96; i++) {
            const seed = `Lorelei-Final-${i * 137}`;
            const url = `https://api.dicebear.com/7.x/lorelei/svg?seed=${seed}&backgroundColor=ffffff`;
            const div = document.createElement('div');
            div.className = 'avatar-card';
            div.innerHTML = `<img src="${url}" onclick="applyAv('${url}')" loading="lazy" style="width:85%;">`;
            grid.appendChild(div);
        }

        function openModal(s) { document.getElementById('avatar-modal').style.display = s ? 'flex' : 'none'; }
        function applyAv(u) { document.getElementById('p-avatar').src = u; openModal(false); }
        function setAlias(el, txt) {
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('p-title').innerText = txt;
        }

        function handleFile(e) {
            const f = e.target.files[0];
            if (f) {
                const r = new FileReader();
                r.onload = (ev) => document.getElementById('p-avatar').src = ev.target.result;
                r.readAsDataURL(f);
            }
        }

        // --- ส่วนที่แก้ไข: เก็บข้อมูลลง LocalStorage และ Redirect ---
        function executeSacredAwakening() {
            // 1. ดึงข้อมูลปัจจุบัน
            const finalName = document.getElementById('name-field').value;
            const finalAvatar = document.getElementById('p-avatar').src;
            const finalAlias = document.getElementById('p-title').innerText;
            const finalBio = document.getElementById('bio-field').value;

            // 2. บันทึกข้อมูล
            const userData = {
                name: finalName,
                avatar: finalAvatar,
                alias: finalAlias,
                bio: finalBio,
                isSetup: true
            };
            localStorage.setItem('masterpiece_user', JSON.stringify(userData));

            // 3. แสดง Animation
            const overlay = document.getElementById('sacred-overlay');
            const blessing = document.getElementById('blessing-text');
            const avatarTarget = document.getElementById('sacred-avatar-target');
            
            avatarTarget.innerHTML = `<img src="${finalAvatar}" style="width:200px; height:200px; border-radius:50%; box-shadow:0 0 30px var(--zen-gold); object-fit:cover;">`;
            
            overlay.style.display = 'flex';
            setTimeout(() => overlay.style.opacity = '1', 10);
            createParticles();
            setTimeout(() => blessing.style.animation = 'fade-up 1.5s forwards', 800);

            // 4. วาร์ปกลับหน้าแรกเมื่อจบพิธี
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = 'index.html'; // ส่งกลับหน้าแรก
                }, 1000);
            }, 4000);
        }

        function createParticles() {
            const overlay = document.getElementById('sacred-overlay');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 2;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + 'vw'; p.style.top = Math.random() * 100 + 'vh';
                overlay.appendChild(p);
                const duration = Math.random() * 3 + 2;
                p.animate([{ transform: 'translateY(0)', opacity: 0.8 }, { transform: `translateY(-200px)`, opacity: 0 }], { duration: duration * 1000 });
                setTimeout(() => p.remove(), duration * 1000);
            }
        }
    </script>
</body>

</html>
